<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Event Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 30px auto;
            padding: 20px;
            background: #f0f4f8;
        }
        h1 { color: #193b70; }
        form {
            background: white;
            padding: 24px;
            border-radius: 10px;
        }
        label { display: block; margin-top: 14px; }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            background: #1769d2;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Student Event Registration</h1>
    <h2>TechConnect 2026</h2>
    <p>Join our campus event for technology talks and student projects.</p>

    <form id="registrationForm">
        <label for="name">Student Name</label>
        <input id="name" required>

        <label for="regno">Register Number</label>
        <input id="regno" required>

        <label for="department">Department</label>
        <select id="department" required>
            <option value="">Select Department</option>
            <option>Computer Science</option>
            <option>Information Technology</option>
            <option>Software Engineering</option>
            <option>Other</option>
        </select>

        <label for="email">Email</label>
        <input id="email" type="email" required>

        <label for="eventDate">Event Date</label>
        <input id="eventDate" type="date" value="2026-11-21" required>

        <button type="submit">Register Now</button>
        <p id="message"></p>
    </form>

    <script>
        document.getElementById("registrationForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();
                document.getElementById("message").textContent =
                    "Registration form validated successfully!";
            });
    </script>
</body>
</html>
