<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Event Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
        }
        h1 { color: #174ea6; text-align: center; }
        p { text-align: center; color: #555; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #174ea6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #0d3475; }
        #message { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TechFest 2026</h1>
        <p>Register for our annual student technology event!</p>

        <form id="registrationForm">
            <label>Student Name</label>
            <input type="text" required placeholder="Enter your full name">

            <label>Register Number</label>
            <input type="text" required placeholder="Enter register number">

            <label>Department</label>
            <select required>
                <option value="">Select Department</option>
                <option>Software Engineering</option>
                <option>Computer Science</option>
                <option>Information Technology</option>
                <option>Electronics and Communication</option>
                <option>Electrical Engineering</option>
                <option>Mechanical Engineering</option>
            </select>

            <label>Email</label>
            <input type="email" required placeholder="Enter your email">

            <label>Event Date</label>
            <input type="date" required>

            <button type="submit">Register Now</button>
            <p id="message"></p>
        </form>
    </div>

    <script>
        document.getElementById("registrationForm").addEventListener("submit", function(event) {
            event.preventDefault();
            document.getElementById("message").textContent =
                "Registration submitted successfully!";
        });
    </script>
</body>
</html>
